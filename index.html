<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trabalho italo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="navabar">
        Bem vindos ao laboratorio Java Script
    </section>
    <h1>Laboratorio Java Script</h1>
    <div class="container">
        <div class="card-1">
            <p>
                Ola, seja bem vindo ao lanoratorio Java Script!
            </p>

            <button id="btnapagar">não leio texto(apagar texto)</button>
            <button id="btnrestaurar">Restaurar texto</button>
            <button id="btnjanela">Ver tamanho da janela</button>
            <p id="status" aria-live="polite"></p>

        </div>


        <div class="card-2">
            <button id="dblClick">botão de clique duplo</button>
            <button id="mouseOver">botão de mouse over</button>

            <h3>detector da posição do mouse</h3>

            <p id="mousePosition">Posição do mouse:</p>

        </div>

        <div class="card-3">

            <h3>detector de tecla pressionada</h3>
            <input type="text" placeholder="Digite algo..." id="inputText">
            <p id="keyPressed">Tecla pressionada:</p>

             <h3>detector de tecla liberada</h3>
            <input type="text" placeholder="Digite algo..." id="inputText">
            <p id="keyReleased">Tecla liberada:</p>
        </div>
        <div class="card-5">

            <h3>Change evento</h3>
            <input type="text" placeholder="Digite algo..." id="changeinput">
            <p id="changeResultado">Texto alterado:</p>
        </div>


    </div>

    <script src="app.js"></script>
</body>

</html>
